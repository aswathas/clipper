<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clipper Muse</title>
  <link rel="stylesheet" href="muse.css">
</head>
<body x-data="museWidget()" :class="expanded ? 'expanded' : 'collapsed'">
  <!-- Collapsed pill — 240x72, always visible. Click anywhere to expand. -->
  <div class="muse-card" :class="['muse-mood-' + mood, museState === 'watching' ? 'watching' : '']"
       @click="expand()" x-show="!expanded" style="cursor: pointer;">
    <div class="muse-mascot" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="36" height="36">
        <!-- Body — round, soft pastel -->
        <defs>
          <radialGradient id="muse-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </radialGradient>
        </defs>
        <circle cx="32" cy="32" r="28" fill="currentColor" opacity="0.18" filter="url(#muse-glow)"/>
        <circle cx="32" cy="32" r="22" fill="currentColor" opacity="0.95"/>
        <!-- Cheeks (always, very subtle) -->
        <circle cx="20" cy="38" r="3" fill="#FF8FA3" opacity="0.45"/>
        <circle cx="44" cy="38" r="3" fill="#FF8FA3" opacity="0.45"/>
        <!-- Eyes -->
        <g class="muse-eyes" :transform="eyeTransform()">
          <ellipse cx="25" cy="30" rx="3.2" ry="4.2" fill="#1A1714"/>
          <ellipse cx="39" cy="30" rx="3.2" ry="4.2" fill="#1A1714"/>
          <circle cx="26" cy="28.5" r="1.1" fill="#fff"/>
          <circle cx="40" cy="28.5" r="1.1" fill="#fff"/>
        </g>
        <!-- Mouth: closed by default; varies by mood via CSS opacity / d-attr -->
        <path class="muse-mouth" d="M28 41 Q32 44 36 41" stroke="#1A1714" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <!-- Antenna — a little wobble when alert -->
        <line class="muse-antenna" x1="32" y1="10" x2="32" y2="2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <circle class="muse-antenna-dot" cx="32" cy="2" r="2" fill="currentColor"/>
        <!-- Sleepy Zzz (off state) -->
        <g class="muse-zzz" x-show="mood === 'sleepy'">
          <text x="50" y="18" font-size="10" fill="currentColor" font-weight="700" font-family="system-ui">z</text>
          <text x="54" y="12" font-size="7" fill="currentColor" font-weight="700" font-family="system-ui">z</text>
        </g>
      </svg>
    </div>
    <div class="muse-body">
      <div class="muse-title">Muse</div>
      <div class="muse-status" x-text="statusText"></div>
    </div>
    <button type="button" class="muse-toggle" :class="museState === 'watching' ? 'on' : ''"
            @click.stop="toggle()" :aria-pressed="museState === 'watching'"
            :title="museState === 'watching' ? 'Stop watching' : 'Start watching'">
      <span x-text="museState === 'watching' ? '■' : '▶'"></span>
    </button>
  </div>

  <!-- Expanded popover — 320x460. Header is the drag handle. -->
  <div class="muse-popover" x-show="expanded" @click.outside="collapse()" x-cloak>
    <div class="muse-popover-head"
         @mousedown="startDrag($event)"
         style="cursor: grab;">
      <div class="muse-mascot small" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="22" height="22">
          <circle cx="32" cy="32" r="22" fill="currentColor" opacity="0.95"/>
          <g class="muse-eyes">
            <ellipse cx="25" cy="30" rx="3.2" ry="4.2" fill="#1A1714"/>
            <ellipse cx="39" cy="30" rx="3.2" ry="4.2" fill="#1A1714"/>
            <circle cx="26" cy="28.5" r="1.1" fill="#fff"/>
            <circle cx="40" cy="28.5" r="1.1" fill="#fff"/>
          </g>
          <path d="M28 41 Q32 44 36 41" stroke="#1A1714" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="muse-popover-title">Muse</div>
      <button type="button" class="muse-popover-close" @click="collapse()" aria-label="Close">×</button>
    </div>

    <div class="muse-popover-section">
      <div class="muse-popover-status">
        <span class="dot" :class="museState"></span>
        <span x-text="statusText"></span>
      </div>
      <button type="button" class="btn" @click="toggle()">
        <span x-text="museState === 'watching' ? 'Pause' : 'Start watching'"></span>
      </button>
    </div>

    <div class="muse-popover-section">
      <div class="muse-popover-label">Recent activity</div>
      <div class="muse-popover-list">
        <template x-for="(e, i) in recentActivity" :key="i">
          <div class="muse-popover-item">
            <span class="ts" x-text="e.ts"></span>
            <span class="title" x-text="e.window_title"></span>
            <span class="cat" x-show="e.category" x-text="'#' + (e.category || '')"></span>
          </div>
        </template>
        <div x-show="recentActivity.length === 0" class="muse-popover-empty">No activity yet.</div>
      </div>
    </div>

    <div class="muse-popover-section">
      <div class="muse-popover-label">Quick settings</div>
      <label class="muse-popover-row">
        <span>Smart dedup</span>
        <input type="checkbox" x-model="cfg.smart_dedup" @change="saveCfg()" />
      </label>
      <label class="muse-popover-row">
        <span>Screenshots</span>
        <input type="checkbox" x-model="cfg.screenshots" @change="saveCfg()" />
      </label>
      <label class="muse-popover-row">
        <span>Record calls</span>
        <input type="checkbox" x-model="cfg.record_calls" @change="saveCfg()" />
      </label>
      <label class="muse-popover-row">
        <span>Capture WhatsApp</span>
        <input type="checkbox" x-model="cfg.capture_whatsapp" @change="saveCfg()" />
      </label>
      <label class="muse-popover-row">
        <span>Open dashboard</span>
        <button type="button" class="btn-link" @click="openDashboard()">↗</button>
      </label>
    </div>

    <div class="muse-popover-foot">
      <span class="muse-popover-hint">Ctrl+Shift+M to toggle · drag header to move</span>
    </div>
  </div>

  <script src="muse.js"></script>
</body>
</html>
