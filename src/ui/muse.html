<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clipper Muse</title>
  <link rel="stylesheet" href="muse.css">
</head>
<body x-data="museWidget()">
  <div class="muse-card" :class="museState === 'watching' ? 'watching' : ''">
    <div class="muse-mascot" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="3"></circle>
        <circle cx="5" cy="6" r="2"></circle>
        <circle cx="19" cy="6" r="2"></circle>
        <circle cx="5" cy="18" r="2"></circle>
        <circle cx="19" cy="18" r="2"></circle>
        <line x1="7" y1="6" x2="10" y2="11"></line>
        <line x1="17" y1="6" x2="14" y2="11"></line>
        <line x1="7" y1="18" x2="10" y2="13"></line>
        <line x1="17" y1="18" x2="14" y2="13"></line>
      </svg>
    </div>
    <div class="muse-body">
      <div class="muse-title">Muse</div>
      <div class="muse-status" x-text="statusText"></div>
    </div>
    <button type="button" class="muse-toggle" :class="museState === 'watching' ? 'on' : ''" @click="toggle()" :aria-pressed="museState === 'watching'" :title="museState === 'watching' ? 'Stop watching' : 'Start watching'">
      <span x-text="museState === 'watching' ? '■' : '▶'"></span>
    </button>
  </div>
  <script src="muse.js"></script>
</body>
</html>
