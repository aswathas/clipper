<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clipper — Smart Clipboard</title>
  <!-- Pico.css from CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <!-- Custom styles & overrides -->
  <link rel="stylesheet" href="styles.css">
  <!-- Alpine.js component -->
  <script src="app.js"></script>
  <!-- Alpine.js from CDN (deferred) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
  <div x-data="clipper()" x-cloak>
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="brand-section">
        <span>📎 Clipper</span>
      </div>

      <div class="search-section">
        <input 
          type="search" 
          placeholder="Search clips (FTS5)..." 
          x-model="query"
          aria-label="Search clips"
        >
      </div>

      <div class="actions-section">
        <button class="secondary outline" @click="openSettings()" title="Settings & Stats">⚙</button>
        <button class="primary" @click="openAddModal()">+ clip</button>
      </div>
    </header>

    <!-- Main Three-Pane Dashboard Grid -->
    <main class="dashboard-grid">
      <!-- PANE 1: TODAY -->
      <section class="pane pane-today">
        <div class="pane-header">
          <h3>Today</h3>
          <span class="badge" x-text="today.length"></span>
        </div>

        <div class="clip-list">
          <template x-if="today.length === 0">
            <div class="empty-state">No clips for today yet.</div>
          </template>

          <template x-for="item in today" :key="item.id">
            <article class="clip-card" :class="{ 'active': selectedId === item.id }">
              <div @click="selectItem(item.id)">
                <div class="clip-title-row">
                  <h4 class="clip-title" x-text="item.title || item.url"></h4>
                  <span class="clip-type-tag" x-text="item.type || 'url'"></span>
                </div>
                <div class="clip-meta">
                  <span x-text="item.source || 'clip'"></span>
                  <span x-text="formatDate(item.saved_at)"></span>
                </div>
                <div class="clip-tags" x-if="item.tags && item.tags.length">
                  <template x-for="tag in item.tags" :key="tag">
                    <span class="tag-badge" x-text="'#' + tag"></span>
                  </template>
                </div>
              </div>

              <!-- Inline Expanded Detail Drawer -->
              <div class="clip-detail-drawer" x-show="selectedId === item.id">
                <p class="summary" x-text="selectedDetail?.summary || item.summary || 'No summary available.'"></p>
                <div class="links">
                  <div><strong>Vault:</strong> <code x-text="selectedDetail?.vault_path || item.vault_path || 'Inbox/'"></code></div>
                  <template x-if="item.url && item.url.startsWith('http')">
                    <div><strong>URL:</strong> <a :href="item.url" target="_blank" rel="noopener noreferrer" x-text="item.url"></a></div>
                  </template>
                </div>
                <div class="action-buttons">
                  <button class="secondary outline" @click.stop="updateStatus(item.id, 'archived')">Archive</button>
                  <button class="secondary outline" @click.stop="addTag(item.id)">Add tag</button>
                  <button class="outline" style="color: var(--clipper-decay-red); border-color: var(--clipper-decay-red);" @click.stop="updateStatus(item.id, 'deleted')">Delete</button>
                </div>
              </div>
            </article>
          </template>
        </div>
      </section>

      <!-- PANE 2: INBOX -->
      <section class="pane pane-inbox">
        <div class="pane-header">
          <h3>Inbox</h3>
          <span class="badge" x-text="items.filter(i => i.status !== 'archived').length"></span>
        </div>

        <div class="clip-list">
          <template x-if="items.filter(i => i.status !== 'archived').length === 0">
            <div class="empty-state">Inbox is empty. All caught up!</div>
          </template>

          <template x-for="item in items.filter(i => i.status !== 'archived')" :key="item.id">
            <article class="clip-card" :class="{ 'active': selectedId === item.id }">
              <div @click="selectItem(item.id)">
                <div class="clip-title-row">
                  <h4 class="clip-title" x-text="item.title || item.url"></h4>
                  <span class="clip-type-tag" x-text="item.type || 'url'"></span>
                </div>
                <div class="clip-meta">
                  <span x-text="item.source || 'clip'"></span>
                  <span x-text="formatDate(item.saved_at)"></span>
                </div>
                <div class="clip-tags" x-if="item.tags && item.tags.length">
                  <template x-for="tag in item.tags" :key="tag">
                    <span class="tag-badge" x-text="'#' + tag"></span>
                  </template>
                </div>
              </div>

              <!-- Inline Expanded Detail Drawer -->
              <div class="clip-detail-drawer" x-show="selectedId === item.id">
                <p class="summary" x-text="selectedDetail?.summary || item.summary || 'No summary available.'"></p>
                <div class="links">
                  <div><strong>Vault:</strong> <code x-text="selectedDetail?.vault_path || item.vault_path || 'Inbox/'"></code></div>
                  <template x-if="item.url && item.url.startsWith('http')">
                    <div><strong>URL:</strong> <a :href="item.url" target="_blank" rel="noopener noreferrer" x-text="item.url"></a></div>
                  </template>
                </div>
                <div class="action-buttons">
                  <button class="secondary outline" @click.stop="updateStatus(item.id, 'archived')">Archive</button>
                  <button class="secondary outline" @click.stop="addTag(item.id)">Add tag</button>
                  <button class="outline" style="color: var(--clipper-decay-red); border-color: var(--clipper-decay-red);" @click.stop="updateStatus(item.id, 'deleted')">Delete</button>
                </div>
              </div>
            </article>
          </template>
        </div>
      </section>

      <!-- PANE 3: LIBRARY -->
      <section class="pane pane-library">
        <div class="pane-header">
          <h3>Library</h3>
          <span class="badge" x-text="items.length"></span>
        </div>

        <div class="library-groups">
          <template x-if="groupLibrary().length === 0">
            <div class="empty-state">No clips indexed in library.</div>
          </template>

          <template x-for="group in groupLibrary()" :key="group.type">
            <div class="library-group">
              <div class="library-group-header">
                <div>
                  <strong x-text="group.type.toUpperCase()"></strong>
                  <span style="font-size: 0.8rem; color: var(--pico-muted-color);" x-text="'(' + group.count + ')'"></span>
                </div>
                <div style="text-align: right; font-size: 0.75rem; color: var(--pico-muted-color);">
                  <span>Last: </span><span x-text="group.lastTouched"></span>
                </div>
              </div>

              <!-- Decay Bar -->
              <div class="decay-bar-container" title="Decay: days since saved / 30">
                <div 
                  class="decay-bar" 
                  :class="group.decayClass" 
                  :style="'width: ' + group.decayPercent + '%;'"
                ></div>
              </div>

              <!-- Group Items List -->
              <div class="clip-list" style="padding: 0.5rem;">
                <template x-for="item in group.items" :key="item.id">
                  <article class="clip-card" :class="{ 'active': selectedId === item.id }">
                    <div @click="selectItem(item.id)">
                      <div class="clip-title-row">
                        <h5 class="clip-title" style="font-size: 0.85rem;" x-text="item.title || item.url"></h5>
                      </div>
                      <div class="clip-meta">
                        <span x-text="item.status"></span>
                        <span x-text="formatDate(item.saved_at)"></span>
                      </div>
                    </div>

                    <!-- Inline Expanded Detail Drawer -->
                    <div class="clip-detail-drawer" x-show="selectedId === item.id">
                      <p class="summary" x-text="selectedDetail?.summary || item.summary || 'No summary available.'"></p>
                      <div class="links">
                        <div><strong>Vault:</strong> <code x-text="selectedDetail?.vault_path || item.vault_path || 'Inbox/'"></code></div>
                        <template x-if="item.url && item.url.startsWith('http')">
                          <div><strong>URL:</strong> <a :href="item.url" target="_blank" rel="noopener noreferrer" x-text="item.url"></a></div>
                        </template>
                      </div>
                      <div class="action-buttons">
                        <button class="secondary outline" @click.stop="updateStatus(item.id, 'archived')">Archive</button>
                        <button class="secondary outline" @click.stop="addTag(item.id)">Add tag</button>
                        <button class="outline" style="color: var(--clipper-decay-red); border-color: var(--clipper-decay-red);" @click.stop="updateStatus(item.id, 'deleted')">Delete</button>
                      </div>
                    </div>
                  </article>
                </template>
              </div>
            </div>
          </template>
        </div>
      </section>
    </main>

    <!-- Modal: + clip -->
    <dialog :open="showAddModal">
      <article>
        <header>
          <button aria-label="Close" rel="prev" @click="closeAddModal()"></button>
          <h3>Add New Clip</h3>
        </header>
        <form @submit.prevent="submitAddClip()">
          <label for="clipUrl">URL or Content</label>
          <input 
            type="text" 
            id="clipUrl" 
            x-model="newClipUrl" 
            placeholder="https://example.com/article" 
            required 
            autofocus
          >
          <footer>
            <button type="button" class="secondary" @click="closeAddModal()">Cancel</button>
            <button type="submit" class="primary">Queue Clip</button>
          </footer>
        </form>
      </article>
    </dialog>

    <!-- Modal: Settings & Stats -->
    <dialog :open="showSettingsModal">
      <article>
        <header>
          <button aria-label="Close" rel="prev" @click="closeSettings()"></button>
          <h3>Clipper Settings & Stats</h3>
        </header>
        <div>
          <p><strong>Daemon Status:</strong> <code>127.0.0.1:7137</code></p>
          <p><strong>Total Clips:</strong> <span x-text="stats.total"></span></p>
          <p><strong>Stale Clips (&gt;30d):</strong> <span x-text="stats.stale_30d"></span></p>
          <div style="margin-top: 1rem;">
            <strong>By Status:</strong>
            <ul>
              <li>Inbox: <span x-text="stats.by_status?.inbox || 0"></span></li>
              <li>Library: <span x-text="stats.by_status?.library || 0"></span></li>
              <li>Archived: <span x-text="stats.by_status?.archived || 0"></span></li>
            </ul>
          </div>
          <div>
            <strong>LAN PWA Pairing:</strong>
            <p style="font-size: 0.85rem; color: var(--pico-muted-color);">
              QR code pairing available on <code>/pair</code> endpoint when HAG-7 lands.
            </p>
          </div>
        </div>
        <footer>
          <button type="button" class="primary" @click="closeSettings()">Close</button>
        </footer>
      </article>
    </dialog>
  </div>
</body>
</html>
