[package]
name = "clipper"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clipper_lib"
# NOTE: Tauri's template also lists `cdylib` here, for mobile targets. The
# windows-gnu linker (ld) cannot emit that DLL — it fails with "export ordinal
# too large" — and nothing in this desktop slice needs it, so it is omitted.
# Add `"cdylib"` back if you start targeting Android/iOS.
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.28.0", features = ["v4"] }
sha2 = "0.10"
toml = "1.1.8"
dirs = "7.0.0"
notify = "8.2.0"
tokio = { version = "1.53.3", features = ["rt", "time", "sync", "macros", "net", "signal"] }
time = { version = "0.3.55", features = ["formatting", "parsing", "local-offset"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
axum = "0.8.9"
image = { version = "0.25.10", default-features = false, features = ["png"] }
qrcode = { version = "0.14.1", features = ["image"] }
rand = "0.9"
pulldown-cmark = "0.13.4"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
base64 = "0.22"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
